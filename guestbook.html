<main class="reader gb"><h1 class="ch">读者留言</h1><p class="lead">想对作者说的话，对故事、游戏和漫剧的期待，都可以写在这里。留言经作者审核后公开显示。</p>
<form id="gbform" data-lang="zh" data-strings="{&quot;gb_sent&quot;: &quot;已收到，谢谢！作者审核后会公开显示。&quot;, &quot;gb_err&quot;: &quot;提交失败，请稍后再试。&quot;, &quot;gb_rate&quot;: &quot;留言太频繁了，请过一会儿再来。&quot;, &quot;gb_short&quot;: &quot;留言内容太短了。&quot;, &quot;gb_empty&quot;: &quot;还没有公开的留言，来写第一条吧。&quot;, &quot;gb_reply&quot;: &quot;作者回复&quot;, &quot;gb_anon&quot;: &quot;匿名读者&quot;}">
<label><span>昵称（可不填）</span><input name="name" maxlength="24" autocomplete="nickname"></label>
<label><span>留言内容</span><textarea name="body" maxlength="800" rows="5" required></textarea></label>
<label class="hp" aria-hidden="true">Website<input name="hp" tabindex="-1" autocomplete="off"></label>
<div class="row"><button type="submit" class="cta">提交留言</button><span id="gbmsg" role="status"></span></div>
<p class="small muted">留言只用于与读者交流，不会提供给任何第三方。</p></form>
